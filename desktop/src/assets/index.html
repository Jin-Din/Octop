<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octop</title>
    <script>
      document.documentElement.dataset.chrome = /Mac|iPhone|iPad/.test(
        navigator.userAgent,
      )
        ? "mac"
        : "windows";
      document.documentElement.style.setProperty(
        "--window-controls-inset-end",
        document.documentElement.dataset.chrome === "mac" ? "80px" : "138px",
      );
      const params = new URLSearchParams(location.search);
      if (params.get("settings") === "1") {
        if (params.get("onboarding") === "1") {
          document.documentElement.dataset.mode = "onboarding";
        } else {
          document.documentElement.dataset.mode = "settings";
        }
        document.documentElement.style.setProperty(
          "--window-controls-inset-end",
          "36px",
        );
      }
    </script>
    <script type="module" src="/wails/runtime.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg-primary: #ffffff;
        --bg-layout: #f5f6f8;
        --bg-secondary: #f7f8fa;
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --text-tertiary: #9ca3af;
        --border: #e5e7eb;
        --brand: #e85d75;
        --brand-hover: #d14a62;
        --brand-soft: #fde8ec;
        --on-brand: #ffffff;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.03);
        --radius: 12px;
        --window-controls-inset-end: 80px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
          "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
        margin: 0;
        background: var(--bg-layout);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }
      .window-chrome {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 20;
        height: 32px;
        --wails-draggable: drag;
      }
      .window-controls {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 30;
        display: none;
        align-items: center;
        height: 32px;
        user-select: none;
        -webkit-app-region: no-drag;
      }
      html[data-chrome="mac"] .ctrl-mac,
      html[data-chrome="windows"] .ctrl-win {
        display: flex;
      }
      html[data-mode="settings"],
      html[data-mode="settings"] body {
        overflow: hidden;
        height: 100%;
        background: var(--bg-primary);
        --window-controls-inset-end: 36px;
      }
      html[data-mode="settings"] .window-controls [data-action="minimise"],
      html[data-mode="settings"] .window-controls [data-action="toggle-maximise"] {
        display: none;
      }
      html[data-mode="settings"] .wrap {
        max-width: none;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 44px 20px 28px;
        position: relative;
      }
      html[data-mode="settings"] #title {
        padding-right: var(--window-controls-inset-end);
      }
      html[data-mode="settings"] .subtitle {
        margin-bottom: 16px;
      }
      html[data-mode="settings"] .actions {
        margin-top: 14px;
        flex-shrink: 0;
      }
      .ctrl-mac {
        gap: 8px;
        padding: 0 12px 0 8px;
      }
      .light {
        width: 12px;
        height: 12px;
        padding: 0;
        border: 0.5px solid transparent;
        border-radius: 50%;
        cursor: pointer;
        appearance: none;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
      }
      .light:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      .glyph {
        opacity: 0;
        display: block;
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        color: inherit;
        pointer-events: none;
        transform: translateY(-0.5px);
      }
      .ctrl-mac:hover .glyph {
        opacity: 0.85;
      }
      .zoom {
        background: #28c840;
        border-color: #12a12a;
        color: #003a08;
      }
      .min {
        background: #febc2e;
        border-color: #d89e19;
        color: #5c3b00;
      }
      .close {
        background: #ff5f57;
        border-color: #e0443e;
        color: #4d0000;
      }
      .win-btn {
        width: 46px;
        height: 32px;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .win-btn:hover {
        background: rgba(0, 0, 0, 0.06);
        color: var(--text-primary);
      }
      .win-btn:focus-visible {
        outline: 2px solid #1677ff;
        outline-offset: -2px;
      }
      .win-close:hover {
        background: #e81123;
        color: #fff;
      }
      .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 56px max(24px, var(--window-controls-inset-end)) 24px 24px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
      }
      .subtitle {
        margin: 0 0 20px;
        font-size: 13px;
        color: var(--text-tertiary);
      }
      .card {
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 14px 16px;
      }
      .row + .row {
        border-top: 1px solid var(--border);
      }
      .row .label {
        font-size: 14px;
        font-weight: 500;
      }
      .row small {
        display: block;
        font-size: 12px;
        line-height: 1.45;
        color: var(--text-tertiary);
        margin-top: 4px;
      }
      select {
        font: inherit;
        font-size: 13px;
        color: var(--text-primary);
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        min-width: 108px;
        outline: none;
      }
      select:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(232, 93, 117, 0.12);
      }
      .row-server {
        align-items: flex-start;
      }
      .row-server .server-text {
        min-width: 0;
      }
      .server-input {
        flex-shrink: 0;
        width: 168px;
      }
      .server-input .text-input {
        width: 100%;
      }
      .text-input {
        flex-shrink: 0;
        width: 168px;
        font: inherit;
        font-size: 13px;
        color: var(--text-primary);
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        outline: none;
      }
      .text-input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(232, 93, 117, 0.12);
      }
      .switch {
        position: relative;
        width: 40px;
        height: 24px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch span {
        position: absolute;
        inset: 0;
        background: #e5e7eb;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.18s ease;
      }
      .switch span::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        transition: transform 0.18s ease;
      }
      .switch input:checked + span {
        background: var(--brand);
      }
      .switch input:checked + span::after {
        transform: translateX(16px);
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .actions button {
        flex: 1;
        padding: 9px 12px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
      }
      .actions .primary {
        background: var(--brand);
        color: var(--on-brand);
        border: 0;
      }
      .actions .primary:hover {
        background: var(--brand-hover);
      }
      .actions .ghost {
        background: var(--bg-primary);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      .actions .ghost:hover {
        background: var(--bg-secondary);
      }
      .status {
        min-height: 1.4em;
        margin: 12px 0 0;
        font-size: 13px;
        color: #b91c1c;
      }
      .loading {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-layout);
        padding: 56px 24px 40px;
        box-sizing: border-box;
      }
      .loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: min(100%, 420px);
        padding: 36px 32px 32px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        text-align: center;
      }
      .loading img {
        width: 120px;
        aspect-ratio: 1;
        height: auto;
        object-fit: contain;
        background: transparent;
        cursor: pointer;
        user-select: none;
        transition: transform 0.18s ease;
      }
      .loading img:hover {
        transform: scale(1.04) translateY(-2px);
      }
      .loading img:active {
        transform: scale(0.94);
      }
      .loading-brand {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }
      .loading-hint {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-tertiary);
      }
      .loading.is-error .loading-hint {
        display: none;
      }
      .loading-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-top: 4px;
      }
      .loading-bar {
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--brand-soft);
      }
      .loading-bar-fill {
        display: block;
        width: 36%;
        height: 100%;
        border-radius: 999px;
        background: var(--brand);
        animation: loading-slide 1.2s ease-in-out infinite;
      }
      .loading-status {
        margin: 0;
        width: 100%;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.55;
      }
      .loading.is-error .loading-bar {
        display: none;
      }
      .loading.is-error .loading-status {
        color: #991b1b;
      }
      @keyframes loading-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .hidden {
        display: none !important;
      }
      /* ---- First-run onboarding: keep only language + server address ---- */
      html[data-mode="onboarding"] .row-auto,
      html[data-mode="onboarding"] .row-tray,
      html[data-mode="onboarding"] .row-sleep {
        display: none;
      }
      html[data-mode="onboarding"] .actions #quit {
        display: none;
      }
      .text-input.invalid {
        border-color: #dc2626;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
      }
      .field-error {
        display: none;
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.45;
        color: #b91c1c;
      }
      .field-error.show {
        display: block;
      }
      .restart-banner {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--brand-soft);
        border: 1px solid rgba(232, 93, 117, 0.35);
      }
      /* Float above the action row so revealing it never grows the fixed-size,
         overflow:hidden settings layout and gets clipped. */
      html[data-mode="settings"] .restart-banner,
      html[data-mode="onboarding"] .restart-banner {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 76px;
        margin-top: 0;
        box-shadow: 0 8px 24px rgba(17, 24, 39, 0.14);
      }
      .restart-banner.show {
        display: block;
      }
      .restart-banner p {
        margin: 0 0 8px;
        font-size: 12.5px;
        line-height: 1.5;
        color: #9f1239;
      }
      .restart-banner button {
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .restart-banner button:hover {
        background: var(--brand-hover);
      }
      /* ---- Fatal remote-connection error screen ---- */
      .fatal-actions {
        display: none;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        margin-top: 4px;
      }
      .loading.is-fatal .loading-bar {
        display: none;
      }
      .loading.is-fatal .fatal-actions {
        display: flex;
      }
      .fatal-actions button {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      .fatal-actions .primary {
        background: var(--brand);
        color: var(--on-brand);
        border: 0;
      }
      .fatal-actions .primary:hover {
        background: var(--brand-hover);
      }
      .fatal-actions .ghost {
        background: var(--bg-primary);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      .fatal-actions .ghost:hover {
        background: var(--bg-secondary);
      }
      .fatal-detail {
        margin: 0;
        width: 100%;
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-tertiary);
        word-break: break-all;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div class="window-chrome octop-desktop-drag" id="window-chrome"></div>
    <div
      class="window-controls ctrl-mac"
      data-chrome="mac"
      data-octop-no-drag="true"
      aria-label="窗口控制"
    >
      <button
        type="button"
        class="light zoom"
        data-action="toggle-maximise"
        aria-label="最大化"
      >
        <span class="glyph" aria-hidden>+</span>
      </button>
      <button
        type="button"
        class="light min"
        data-action="minimise"
        aria-label="最小化"
      >
        <span class="glyph" aria-hidden>–</span>
      </button>
      <button
        type="button"
        class="light close"
        data-action="close"
        aria-label="关闭"
      >
        <span class="glyph" aria-hidden>×</span>
      </button>
    </div>
    <div
      class="window-controls ctrl-win"
      data-chrome="windows"
      data-octop-no-drag="true"
      aria-label="Window controls"
    >
      <button type="button" class="win-btn" data-action="minimise" aria-label="Minimize">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button
        type="button"
        class="win-btn"
        data-action="toggle-maximise"
        aria-label="Maximize"
      >
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" />
        </svg>
      </button>
      <button
        type="button"
        class="win-btn win-close"
        data-action="close"
        aria-label="Close"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div class="loading" id="loading-panel">
      <div class="loading-card">
        <img
          id="mascot"
          src="/octop-mascot-peek.webp"
          alt="Octop"
          draggable="false"
        />
        <p class="loading-brand" id="loading-brand">Octop</p>
        <p class="loading-hint" id="loading-hint">
          正在检查运行环境，可能需要几分钟。
        </p>
        <div class="loading-footer">
          <div class="loading-bar" role="progressbar" aria-hidden="true">
            <span class="loading-bar-fill"></span>
          </div>
          <p class="loading-status" id="status">正在启动，请稍候…</p>
        </div>
        <p class="fatal-detail hidden" id="fatal-detail"></p>
        <div class="fatal-actions" id="fatal-actions">
          <button type="button" class="primary" id="fatal-settings">
            打开设置
          </button>
          <button type="button" class="ghost" id="fatal-quit">退出</button>
        </div>
      </div>
    </div>

    <div id="settings-panel" class="hidden">
      <div class="wrap">
        <h1 id="title">Octop 设置</h1>
        <p class="subtitle" id="subtitle">桌面端偏好</p>
        <div class="card">
          <div class="row">
            <div>
              <div class="label" id="l-lang">语言 / Language</div>
              <small id="h-lang"
                >选择偏好语言 / Choose your preferred language</small
              >
            </div>
            <select id="locale">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="row row-server">
            <div class="server-text">
              <div class="label" id="l-server">服务器地址</div>
              <small id="h-server"
                >填写远端地址直接连接，留空使用本机内置运行环境</small
              >
            </div>
            <div class="server-input">
              <input
                type="text"
                id="server-url"
                class="text-input"
                placeholder="http://192.168.1.10:8088"
                autocomplete="off"
                spellcheck="false"
              />
              <div class="field-error" id="server-error"></div>
            </div>
          </div>
          <div class="row row-auto">
            <div>
              <div class="label" id="l-auto">开机启动</div>
              <small id="h-auto">登录系统后自动启动</small>
            </div>
            <label class="switch">
              <input type="checkbox" id="autostart" />
              <span></span>
            </label>
          </div>
          <div class="row row-tray">
            <div>
              <div class="label" id="l-tray">最小化到托盘</div>
              <small id="h-tray"
                >点击最小化时隐藏窗口并保留在系统托盘</small
              >
            </div>
            <label class="switch">
              <input type="checkbox" id="tray" />
              <span></span>
            </label>
          </div>
          <div class="row row-sleep">
            <div>
              <div class="label" id="l-sleep">防止系统休眠</div>
              <small id="h-sleep">应用运行期间阻止系统自动休眠</small>
            </div>
            <label class="switch">
              <input type="checkbox" id="sleep" />
              <span></span>
            </label>
          </div>
        </div>
        <div class="restart-banner" id="restart-banner" role="alert">
          <p id="restart-text">服务器地址已更改，重启后生效。</p>
          <button type="button" id="restart-now">立即重启</button>
        </div>
        <div class="actions">
          <button class="primary" id="show-main">显示 Octop</button>
          <button class="primary hidden" id="onboarding-done">完成</button>
          <button class="ghost" id="quit">退出</button>
        </div>
        <p class="status hidden" id="settings-status"></p>
      </div>
    </div>
    <script type="module">

          autoH: "Start automatically after you sign in",
          tray: "Minimize to tray",
          trayH: "Hide the window on minimize and keep Octop in the tray",
          sleep: "Prevent system sleep",
          sleepH: "Keeps the system awake while Octop is running",
          showMain: "Show Octop",
          quit: "Quit",
          winGroup: "Window controls",
          winMin: "Minimize",
          winMax: "Maximize",
          winClose: "Close",
          onboardingTitle: "Welcome to Octop",
          onboardingSubtitle:
            "Confirm your server address before you start using Octop",
          onboardingDone: "Get started",
          remoteRequired:
            "This is a lightweight build with no bundled local runtime. A remote server address is required.",
          invalidURL:
            "Enter a valid http:// or https:// URL, or leave it empty to use the local runtime.",
          restartText:
            "The server address has changed. Restart Octop for it to take effect.",
          restartNow: "Restart now",
          openSettings: "Open settings",
          fatalQuit: "Quit",
        },
      };

      function applyWindowCopy(t) {
        for (const group of document.querySelectorAll(".window-controls")) {
          group.setAttribute("aria-label", t.winGroup);
        }
        for (const btn of document.querySelectorAll("[data-action]")) {
          const action = btn.getAttribute("data-action");
          if (action === "minimise") btn.setAttribute("aria-label", t.winMin);
          if (action === "toggle-maximise")
            btn.setAttribute("aria-label", t.winMax);
          if (action === "close") btn.setAttribute("aria-label", t.winClose);
        }
      }

      function applyCopy(locale) {
        const t = copy[locale] || copy.en;
        const onboarding =
          document.documentElement.dataset.mode === "onboarding";
        document.getElementById("title").textContent = onboarding
          ? t.onboardingTitle
          : t.title;
        document.getElementById("subtitle").textContent = onboarding
          ? t.onboardingSubtitle
          : t.subtitle;
        document.getElementById("l-lang").textContent = t.lang;
        document.getElementById("h-lang").textContent = t.langH;
        document.getElementById("l-server").textContent = t.server;
        document.getElementById("h-server").textContent = t.serverH;
        document.getElementById("server-url").placeholder = t.serverPlaceholder;
        document.getElementById("l-auto").textContent = t.auto;
        document.getElementById("h-auto").textContent = t.autoH;
        document.getElementById("l-tray").textContent = t.tray;
        document.getElementById("h-tray").textContent = t.trayH;
        document.getElementById("l-sleep").textContent = t.sleep;
        document.getElementById("h-sleep").textContent = t.sleepH;
        document.getElementById("show-main").textContent = t.showMain;
        document.getElementById("quit").textContent = t.quit;
        document.getElementById("onboarding-done").textContent =
          t.onboardingDone;
        document.getElementById("restart-text").textContent = t.restartText;
        document.getElementById("restart-now").textContent = t.restartNow;
        document.getElementById("fatal-settings").textContent = t.openSettings;
        document.getElementById("fatal-quit").textContent = t.fatalQuit;
        document.getElementById("loading-hint").textContent = t.loadingHint;
        applyWindowCopy(t);
      }

      function emitWindowAction(action) {
        const invoke = window._wails?.invoke;
        if (typeof invoke === "function") {
          invoke(`wails:event:emit:desktop:${action}`);
          return;
        }
        Events.Emit("desktop:" + action);
      }

      document.body.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");
        const mode = document.documentElement.dataset.mode;
        if (action === "close" && mode === "settings") {
          call("HideSettings");
          return;
        }
        if (action === "close" && mode === "onboarding") {
          // First-run setup is modal; the only escape is to quit the app.
          call("Quit");
          return;
        }
        emitWindowAction(action);
      });

      async function call(name, ...args) {
        return Call.ByName("main.App." + name, ...args);
      }

      const MASCOT_IMAGES = [
        "/octop-mascot-peek.webp",
        "/octop-mascot-type.webp",
      ];
      const mascotEl = document.getElementById("mascot");
      let mascotSrc = MASCOT_IMAGES[0];
      function pickMascot(current) {
        let next = current;
        while (next === current) {
          next = MASCOT_IMAGES[Math.floor(Math.random() * MASCOT_IMAGES.length)];
        }
        return next;
      }
      mascotSrc = pickMascot(mascotSrc);
      mascotEl.src = mascotSrc;
      mascotEl.addEventListener("click", () => {
        mascotSrc = pickMascot(mascotSrc);
        mascotEl.src = mascotSrc;
      });

      function current() {
        return {
          locale: document.getElementById("locale").value,
          autostart: document.getElementById("autostart").checked,
          minimizeToTray: document.getElementById("tray").checked,
          preventSleep: document.getElementById("sleep").checked,
          serverURL: document.getElementById("server-url").value.trim(),
        };
      }

      function settingsStatusEl() {
        return document.getElementById("settings-status");
      }

      const serverInput = document.getElementById("server-url");
      const serverErrorEl = document.getElementById("server-error");
      const restartBanner = document.getElementById("restart-banner");

      function showServerError(message) {
        serverErrorEl.textContent = message;
        serverErrorEl.classList.add("show");
        serverInput.classList.add("invalid");
      }

      function clearServerError() {
        serverErrorEl.classList.remove("show");
        serverErrorEl.textContent = "";
        serverInput.classList.remove("invalid");
      }

      function isInvalidURLError(error) {
        return /invalid server URL/i.test(String(error));
      }

      // Persist current form values. Returns true when the settings were
      // written, false when validation rejected them.
      async function persist() {
        let savedBefore;
        const errEl = settingsStatusEl();
        clearServerError();
        try {
          savedBefore = await call("GetSettingsStatus");
          const previousURL = savedBefore.serverURL || "";
          const saved = await call("SaveSettings", {
            ...savedBefore,
            ...current(),
          });
          document.getElementById("autostart").checked = !!saved.autostart;
          document.getElementById("sleep").checked = !!saved.preventSleep;
          document.getElementById("server-url").value = saved.serverURL || "";
          errEl.classList.add("hidden");
          applyCopy(saved.locale);
          // A changed server address only takes effect after a restart. Never
          // prompt during first-run onboarding (boot has not started yet).
          if (
            document.documentElement.dataset.mode === "settings" &&
            (saved.serverURL || "") !== previousURL
          ) {
            restartBanner.classList.add("show");
          }
          return true;
        } catch (error) {
          if (isInvalidURLError(error)) {
            // Keep the user's text so they can fix it; nothing was written.
            showServerError(
              (copy[locale] || copy.en).invalidURL,
            );
            errEl.classList.add("hidden");
            return false;
          }
          if (savedBefore) {
            document.getElementById("autostart").checked =
              !!savedBefore.autostart;
            document.getElementById("sleep").checked =
              !!savedBefore.preventSleep;
          }
          errEl.textContent = String(error);
          errEl.classList.remove("hidden");
          return false;
        }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const settingsMode = urlParams.get("settings") === "1";
      const onboardingMode = urlParams.get("onboarding") === "1";
      const s = await call("GetSettingsStatus");
      const runtimeAvailable = settingsMode
        ? await call("RuntimeAvailable")
        : true;
      const locale = s.locale || "en";
      document.getElementById("status").textContent =
        (copy[locale] || copy.en).statusWait;
      applyCopy(locale);

      if (settingsMode) {
        const t = copy[locale] || copy.en;
        document.getElementById("loading-panel").classList.add("hidden");
        document.getElementById("settings-panel").classList.remove("hidden");
        document.getElementById("locale").value = locale;
        document.getElementById("autostart").checked = !!s.autostart;
        document.getElementById("tray").checked = s.minimizeToTray !== false;
        document.getElementById("sleep").checked = !!s.preventSleep;
        document.getElementById("server-url").value = s.serverURL || "";

        for (const id of ["locale", "autostart", "tray", "sleep"]) {
          document.getElementById(id).addEventListener("change", persist);
        }
        serverInput.addEventListener("change", persist);
        // Clear the inline URL error as soon as the user edits the field.
        serverInput.addEventListener("input", clearServerError);
        document
          .getElementById("show-main")
          .addEventListener("click", () => call("ShowMain"));
        document
          .getElementById("quit")
          .addEventListener("click", () => call("Quit"));
        document
          .getElementById("restart-now")
          .addEventListener("click", () => call("RestartApp"));

        if (onboardingMode) {
          // First run: hide normal-mode chrome, expose only the "Get started"
          // action and keep the popover modal.
          document
            .getElementById("show-main")
            .classList.add("hidden");
          document
            .getElementById("onboarding-done")
            .classList.remove("hidden");
          if (!runtimeAvailable) {
            document.getElementById("h-server").textContent =
              t.remoteRequired;
          }
          document
            .getElementById("onboarding-done")
            .addEventListener("click", async () => {
              const address = serverInput.value.trim();
              if (!runtimeAvailable && address === "") {
                showServerError(t.remoteRequired);
                return;
              }
              const ok = await persist();
              if (ok) {
                await call("CompleteOnboarding");
              }
            });
          // Tell the backend the onboarding page is loaded. The popover is a
          // tray-attached window and can only be shown once the tray is ready,
          // which is guaranteed by the time this event is handled.
          Events.Emit("desktop:onboarding-ready");
        }
      }

      Events.On("desktop:boot-fatal", (ev) => {
        const payload =
          typeof ev === "object" && ev !== null
            ? ev.data ?? ev.payload ?? ev
            : {};
        const data = payload || {};
        const panel = document.getElementById("loading-panel");
        panel.classList.remove("hidden", "is-error");
        panel.classList.add("is-fatal");
        document.getElementById("settings-panel").classList.add("hidden");
        document.getElementById("status").textContent =
          data.title || "Connection failed";
        const hint = document.getElementById("loading-hint");
        if (data.hint) hint.textContent = data.hint;
        const detail = document.getElementById("fatal-detail");
        detail.textContent = [data.url, data.detail]
          .filter(Boolean)
          .join("\n");
        detail.classList.remove("hidden");
        document
          .getElementById("fatal-settings")
          .addEventListener("click", () => call("ShowSettings"));
        document
          .getElementById("fatal-quit")
          .addEventListener("click", () => call("Quit"));
      });

      Events.On("desktop:status", (ev) => {
        const msg =
          typeof ev === "string"
            ? ev
            : ev?.data ?? ev?.payload ?? JSON.stringify(ev);
        const text = String(msg);
        document.getElementById("status").textContent = text;
        const stuck = /未就绪|did not become ready|无法连接|Could not connect/.test(
          text,
        );
        document.getElementById("loading-panel").classList.toggle("is-error", stuck);
      });
    </script>
  </body>
</html>
